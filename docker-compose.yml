services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$${MYSQL_USER}\" --password=\"$${MYSQL_PASSWORD}\" -D \"$${MYSQL_DATABASE}\" -e 'SELECT 1 FROM user_profile LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  postgres-vector:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGVECTOR_DATABASE:?Set PGVECTOR_DATABASE in .env}
      POSTGRES_USER: ${PGVECTOR_USERNAME:?Set PGVECTOR_USERNAME in .env}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?Set PGVECTOR_PASSWORD in .env}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./sql/pgvector-init.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  backend:
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
      postgres-vector:
        condition: service_healthy
        restart: true
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Shanghai"
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      DB_USERNAME: ${MYSQL_USER:?Set MYSQL_USER in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CHAT_MEMORY_MAX_MESSAGES: ${CHAT_MEMORY_MAX_MESSAGES:-20}
      AI_CHAT_RATE_LIMIT: ${AI_CHAT_RATE_LIMIT:-20}
      AI_UPLOAD_RATE_LIMIT: ${AI_UPLOAD_RATE_LIMIT:-5}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      PGVECTOR_HOST: postgres-vector
      PGVECTOR_PORT: "5432"
      PGVECTOR_DATABASE: ${PGVECTOR_DATABASE:?Set PGVECTOR_DATABASE in .env}
      PGVECTOR_USERNAME: ${PGVECTOR_USERNAME:?Set PGVECTOR_USERNAME in .env}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:?Set PGVECTOR_PASSWORD in .env}
      PGVECTOR_DIMENSIONS: ${PGVECTOR_DIMENSIONS:-1536}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12

  frontend:
    security_opt:
      - no-new-privileges:true
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8088}:80"

volumes:
  mysql_data:
  pgvector_data:
